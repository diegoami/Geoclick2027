    dod:
      - "`npm run check` typechecks data/scripts and passes"
      - "`npm run lint` covers data/scripts and passes"
      - "no `any` remains in data/scripts, or each survivor has a justifying comment"
      - "no behavioural change — diff is types and annotations only"
      - "no committed map.json or .pmtiles file changes"
      - "all four gates pass"

  - id: GC-010
    title: "SRS scheduler: cap the interval, let the ease factor recover"
    engine: opus
    effort: Medium
    wave: 1
    deps: [GC-001]
    release: v0.1.1
    branch: fix/gc-010-srs-scheduler
    type: fix
    areas: [srs]
    priority: must-fix
    files: [packages/srs/src/index.ts, packages/srs/src/index.test.ts, ARCHITECTURE.md, DECISIONS.md]
    review_refs: [C1, C2, C3, S3, "#1", "#2", "#19"]
    description: |
      Two defects in `packages/srs/src/index.ts`, both verified by running the
      real `rate()`:

      (a) UNBOUNDED INTERVAL — line 96, `interval = Math.round(prevInterval *
      easeFactor)`, with no cap. `addDaysLocal` (lines 28-34) then overflows
      the JS `Date` range. Measured progression from a clean start:

          rep  8 -> interval 1488      dueDate 2032-10-12
          rep 12 -> interval 58125     dueDate 2291-03-24
          rep 19 -> interval 35476875  dueDate 163913-04-19
          rep 20 -> interval 88692188  dueDate "NaN-NaN-NaN"

      `"NaN-NaN-NaN"` string-compares greater than any real date, so
      `isDue()` returns false permanently — the card silently leaves the
      review pool forever. The value is persisted verbatim by all three
      backends (`due_date TEXT NOT NULL` accepts it) and poisons the home
      page's due count. Well before the NaN, rep 8 means the score panel
      prints "Next review in 2265 days", which is a product bug on its own.

      (b) EASE FACTOR NEVER INCREASES — line 91,
      `Math.max(MIN_EASE_FACTOR, prevEase - (grade === 'hard' ? 0.15 : 0))`.
      `'good'` subtracts zero; nothing ever adds. Measured: one `'hard'`
      followed by 20 flawless `'good'` reviews leaves ease at 2.35, never
      recovering. Alternating hard/good 12x reaches 1.60 and keeps falling.
      Every card monotonically decays toward the 1.3 floor. Real SM-2 raises
      EF on a high-quality answer — and both `ARCHITECTURE.md` and this
      module's own header comment (line 70) call this "classic SM-2", so the
      docs are wrong too.

      Do:
      - Add `MAX_INTERVAL_DAYS` and clamp `interval` before computing
        `dueDate`. Recommended value 365; this is a geography quiz, not a
        medical-school deck. Justify whatever you pick in DECISIONS.md.
      - Add `MAX_EASE_FACTOR` (recommend 2.5, the default) and make `'good'`
        do `Math.min(MAX_EASE_FACTOR, prevEase + 0.1)`.
      - Correct the "classic SM-2" claim in the module header comment AND in
        ARCHITECTURE.md's Domain model section, so code and docs agree on what
        this scheduler actually is.
      - Add a DECISIONS.md entry recording both choices and why.

      Do NOT change the `'again'` same-day behaviour — DECISIONS.md's
      "Iteration 6 retires the same-day mechanism" entry depends on it, and
      there is a passing test for it.
      Do NOT migrate existing persisted card states in this task; any card
      already holding a NaN dueDate is a separate concern — report it if you
      think it needs one.
    dod:
      - "`rate()` after 30 consecutive 'good' grades still yields a parseable YYYY-MM-DD"
      - "a test asserts exactly that, and fails without the cap"
      - "a test asserts ease recovers after 'hard' then several 'good' grades"
      - "a test asserts ease never exceeds MAX_EASE_FACTOR"
      - "the existing 16 srs tests still pass unmodified, including the 'again' same-day test"
      - "module header comment and ARCHITECTURE.md no longer claim 'classic SM-2' inaccurately"
      - "DECISIONS.md records the interval cap and ease ceiling with reasoning"
      - "all four gates pass"

  - id: GC-020
    title: "QuizView lifecycle safety and practice-mode persistence"
    engine: opus
    effort: Medium
    wave: 1
    deps: [GC-001]
    release: v0.1.1
    branch: fix/gc-020-quizview-lifecycle
    type: fix
    areas: [quiz]
    priority: must-fix
    files: [app/src/lib/QuizView.svelte, DECISIONS.md]
    review_refs: [C4, C5, C6, "#4", "#5", "#6"]
    description: |
      Three items in `app/src/lib/QuizView.svelte`: two crashes and one
      doc/code contradiction.

      (a) setFeatureState BEFORE STYLE LOAD (line 557). `phase = 'upToDate'`
      is set synchronously right after `createMap()`, before the
      `map.once('load')` handler at line 571. The "Practice all regions"
      button renders immediately (lines 616-621). Clicking it calls
      `startPractice()` (512) -> `clearAllVisuals()` (463-473) ->
      `map.setFeatureState(...)`, which MapLibre throws on until the style's
      sources exist. Every other call site in this file defers to `'load'`
      with a comment saying why; this path was missed. Reachable on a slow
      tile fetch or a fast click.
      Fix: a `styleLoaded` flag set in the `map.once('load')` handler; gate
      the upToDate panel's render (or `clearAllVisuals`) on it.

      (b) TIMER SURVIVES UNMOUNT (lines 406-414). The wrong-answer flash
      schedules a 700ms `setTimeout` calling `map.setFeatureState`. `onDestroy`
      (593-595) calls `map.remove()` but never clears the timer, and the guard
      `if (exactName && map)` still passes because `map` is a truthy reference
      to a removed map. Navigating away within 700ms throws.
      Fix: keep the handle, `clearTimeout` in `onDestroy`. `TourView.svelte`'s
      `advanceTimer` (line 158) already does this correctly — copy that shape.

      (c) PRACTICE MODE WRITES TO THE REPOSITORY (lines 162-168). DECISIONS.md
      states "Practice mode never writes back to SRS state." The completion
      `$effect` calls `saveLastSessionSummary` unconditionally, including in
      practice mode. It is not SRS state, but it IS persisted state that
      overwrites the home page's "Last: 18/20" — so a casual practice round
      rewrites the record of a real graded session.
      Resolve it: either add `&& mode === 'due'`, or amend the DECISIONS.md
      entry to say summaries are deliberately included. Pick one, implement
      it, and record the choice in DECISIONS.md. Do not leave them
      contradicting each other.

      ALSO, two restored nice-to-haves in the same file (both one-liners):

      (d) NON-REACTIVE BINDINGS (lines 39-41, review item #23). `trayEl`,
      `trayHandleRowEl` and `traySlipsEl` are `bind:this` targets read inside
      `measureTraySizing`, which is called from an `$effect`. svelte-check
      emits three `non_reactive_update` warnings. Declare them `$state`.

      (e) DEBUG HOOK IN PRODUCTION (lines 550-555, review item #24).
      `window.__map` ships to every user of the live site. Guard it with
      `import.meta.env.DEV`.

      SCOPE NOTE: `resolveDrop` extraction is GC-021 and popup text is GC-022.
      Both queue behind this branch — do not pre-empt them.
    dod:
      - "clicking 'Practice all regions' before tiles load does not throw (test by throttling the network in devtools, or by asserting the guard)"
      - "navigating away within 700ms of a wrong drop does not throw"
      - "practice-mode summary behaviour and DECISIONS.md agree, and the choice is recorded"
      - "svelte-check reports 0 warnings for QuizView.svelte (was 3)"
      - "`window.__map` is absent from a production build — check `app/build` for the string"
      - "no change to drop hit-testing logic — that is GC-021's scope"
      - "all four gates pass"

  - id: GC-021
    title: "Extract and unit-test resolveDrop"
    engine: opus
    effort: High
    wave: 2
    deps: [GC-020, GC-003]
    release: v0.1.2
    branch: refactor/gc-021-resolve-drop
    type: refactor
    areas: [quiz, testing]
    priority: worth-doing
    files: [app/src/lib/quizDrop.ts, app/src/lib/quizDrop.test.ts, app/src/lib/QuizView.svelte]
    review_refs: [D8, "#10"]
    description: |
      `QuizView.svelte` is 909 lines and holds essentially all of the app's
      genuinely tricky logic. The tested code (`packages/quiz-engine`,
      `packages/srs`) is the code least likely to break. The single highest-
      value extraction is the drop-correctness decision at
      `QuizView.svelte:344-373`, which currently exists only as inline code
      plus a long comment describing a bug that was found by hand.

      Extract a pure function into `app/src/lib/quizDrop.ts`:

          resolveDrop(args: {
            exactName: string | undefined;
            nearbyNames: string[];
            draggedName: string;
            isPointMap: boolean;
            closestName: string | undefined;  // precomputed by the caller
          }): { scored: boolean; correct: boolean }

      `scored: false` means "not a plausible guess — do not record an attempt"
      (the current `if (!exactName && nearbyNames.length === 0) return`).
      Keep `closestNameAmong` in the component: it needs `map.project()` and
      is therefore not pure. Pass its result in.

      Preserve the existing semantics exactly — the comments at 354-368
      document three separate bugs found by real play, and this refactor must
      not regress any of them:
      - polygon maps use `nearbyNames.includes(draggedName)`;
      - point maps additionally require the dragged target to be the CLOSEST
        candidate, because two city markers can sit inside the tolerance
        radius of each other;
      - the tolerance only ever rescues a CORRECT drop, it never reattributes
        which region a wrong drop hit.

      Tests to write in `quizDrop.test.ts`, at minimum:
      - exact hit on the correct polygon -> scored, correct
      - exact miss, correct name within tolerance -> scored, correct
      - exact hit on a DIFFERENT polygon, correct name also within tolerance
        -> scored, INCORRECT (tolerance must not rescue a wrong drop)
      - drop on empty sea, nothing nearby -> not scored
      - point map, two candidates in radius, dragged target is the farther one
        -> scored, INCORRECT. This is the Essen/Duisburg case (~22px apart at
        default zoom, inside the 30px tolerance) that currently exists only as
        a prose comment.
      - point map, dragged target is the closest candidate -> scored, correct

      Do NOT change tolerance constants. Do NOT touch the pointer-event
      handlers beyond replacing the inline decision with the call.
    dod:
      - "`app/src/lib/quizDrop.ts` exports a pure `resolveDrop` with no map/DOM import"
      - "QuizView calls it; the inline decision block is gone"
      - "at least the six listed cases are tested and pass"
      - "the Essen/Duisburg case is an actual test, not a comment"
      - "manual check: play one polygon quiz and one towns quiz in the dev server; correct/wrong/reveal all still behave"
      - "all four gates pass"

  - id: GC-022
    title: "Popup setText instead of raw HTML interpolation"
    engine: opus
    effort: Low
    wave: 3
    deps: [GC-021]
    release: v0.2.0
    branch: fix/gc-022-popup-text
    type: fix
    areas: [ui]
    priority: worth-doing
    files:
      - app/src/lib/TourView.svelte
      - app/src/lib/MapView.svelte
      - app/src/lib/QuizView.svelte
      - app/src/lib/OverviewView.svelte
    review_refs: [C8, "#17"]
    description: |
      Target names are interpolated straight into popup HTML:
      `TourView.svelte:82` (`setHTML(\`<strong>${target.name}</strong>\`)`),
      `MapView.svelte:57`, `QuizView.svelte:327`, `OverviewView.svelte:48`.
      Names come from Natural Earth today so this is not exploitable now, but
      ROADMAP.md's user-authored/OSM map direction would make it so, and
      `desktop/src-tauri/tauri.conf.json` sets `"csp": null`, so there is no
      second line of defence.

      Do:
      - Switch all four call sites to `setText()`.
      - Where the markup carried styling (TourView's `<strong>`), reproduce it
        in that component's own `<style>` block targeting the popup content
        class. Keep it local to TourView.

      ALSO (review item #21, restored nice-to-have): DEDUPLICATE THE POPUP CSS.
      `:global(.geoclick-popup .maplibregl-popup-content)` is byte-identical in
      `MapView.svelte:106-118` and `TourView.svelte:255-267`;
      `:global(.geoclick-solved-popup ...)` is duplicated in
      `QuizView.svelte:893-908` and `OverviewView.svelte:92-104`. A styling
