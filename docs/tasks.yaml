    review_refs: [D12, "#29"]
    description: |
      Restored nice-to-have (review item #29). Low effort — it is one
      DECISIONS.md entry, and the measurements it needs are three shell
      commands. It executes nothing.

      `data/maps` holds ~14 MB of binary `.pmtiles` tracked in git across 44
      files, and every map rebuild writes a fresh blob for each. At 22
      countries this is fine; history is already permanent, and each future
      country batch adds roughly 0.3-1 MB per map forever.

      Write a DECISIONS.md entry that actually decides. Cover:
      - measured current cost (repo size, per-map size, growth per country batch)
      - the options: status quo; Git LFS; fetch-at-build from a release
        artefact; generate-at-build (rejected — needs WSL2 on Netlify)
      - the cost of each, INCLUDING that Git LFS on a private repo has a quota
        and that migrating existing history means a rewrite every clone must
        re-pull
      - how each interacts with the three shells: the Netlify build, Tauri's
        `frontendDist`, and Capacitor's `cap sync` — all three currently just
        read the files off disk
      - a recommendation and a trigger condition ("revisit at N countries or
        M MB")

      DO NOT execute any migration. A history rewrite is an Ultrahigh,
      irreversible change requiring the product owner's explicit approval; if
      the ADR recommends one, it is filed as a separate task for later, not
      done here.
