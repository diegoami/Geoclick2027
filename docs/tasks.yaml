    description: |
      Restored nice-to-haves (review items #22, #27, #28), all low effort.
      Three small, independent fixes in the map build scripts. None changes
      generated output.

      (a) HARDCODED BINARY PATH (#22). `build-map.ts:414` and
      `build-points-map.ts:312` both call
      `path.join(process.env.HOME ?? '', '.local/bin/pmtiles')`. That pins one
      user's install location for a tool that is on PATH, and fails with an
      opaque ENOENT for anyone else. Replace with
      `process.env.PMTILES_BIN ?? 'pmtiles'` and document the env var in
      MAPS.md.

      (b) SLUGIFY REGEX (#27). `mapBuildUtils.ts:31` writes the
      combining-diacritic range as raw literal characters. It works but is
      invisible in most editors. Replace with the escaped range
      `/[̀-ͯ]/g`. Also note in a comment that `slugify` has no
      non-Latin fallback — a future `--name-field=NAME_ZH` or `NAME_RU` would
      yield empty ids for every target. Do not fix that here; just document it.

      (c) BBOX ASSERTION (#28). `build-map.ts:196-203`'s antimeridian wrap can
      emit a bbox where west > east. `russia-regions`' Chukotka has exactly
      that: `[157.692, 61.8148, -169.7009, 71.6]`. This was checked in a
      browser and does NOT break the app — MapLibre's `cameraForBounds` calls
      `adjustAntiMeridian()` and the tour frames Chukotka correctly. But it
      silently mis-clips `overallBboxOf` (mapBuildUtils.ts:37-49) for the lake
      `-spat` filter, and any non-MapLibre consumer would get it wrong.
      Do NOT "fix" the bbox. Emit an explicit `crossesAntimeridian: true` flag
      on such targets and log a warning at build time, so the condition is
      documented rather than rediscovered. Note it in MAPS.md.

      This task must not alter any committed map.json or tileset — the flag in
      (c) is emitted by the build script for future runs, not backfilled into
      committed data. If you conclude it must be backfilled, say so in the task
      log and stop; that is GC-032's territory (it is the task that rewrites
      map.json).
    dod:
      - "`PMTILES_BIN` env var honoured, defaults to `pmtiles` on PATH, documented in MAPS.md"
      - "slugify uses the escaped `\\u0300-\\u036f` range; the non-Latin limitation is commented"
      - "a target whose bbox wraps the antimeridian is flagged and warned about at build time"
      - "no committed map.json or .pmtiles file changes"
      - "GC-030's mapData.test.ts still passes"
      - "all four gates pass"

  - id: GC-032
    title: "Adjacency-aware map palette and unsolved-opacity revisit"
    engine: opus
    effort: High
    wave: 3
    deps: [GC-030, GC-031]
    release: v0.2.0
    branch: feat/gc-032-map-palette
    type: feat
    areas: [data, ui]
    priority: worth-doing
    files:
      - data/styles/base.json
      - data/scripts/build-map.ts
      - data/scripts/build-points-map.ts
      - data/maps/*/map.json
      - app/src/lib/geoclickMap.ts
      - DECISIONS.md
    review_refs: [D4, "#8"]
    description: |
      The 8-colour categorical palette is a name-length hash —
      `["%", ["length", ["get","name"]], 8]` in `data/styles/base.json:74` and
      `:134`. Two compounding problems, both measured.

      (a) THE HASH IS MUCH WORSE THAN RANDOM. Place names cluster at 5-8
      characters, so the global bucket distribution across all 1410 targets
      runs from 5.0% (bucket 3) to 20.8% (bucket 7), not 12.5% each.
      Same-colour adjacent pairs (bbox-overlap proxy for adjacency):

          italy-provinces        297 adjacent pairs, 61 same colour (20.5%)
          usa-states             122 /  26 (21.3%)
          japan-regions          109 /  24 (22.0%)
          china-regions           80 /  16 (20.0%)
          great-britain-regions   32 /  10 (31.3%)

      Random 8-colouring gives ~12.5%. Worse, collisions CLUSTER spatially:
      Bolzano/Sondrio/Belluno/Brescia/Bergamo are all 7 letters, so a
      contiguous swath of northern Italy renders in one identical olive.
      North Dakota / South Dakota (both 12) are adjacent and identical.

      (b) THE OPACITY FIX MASKED IT. The 2026-09-13 solved-contrast change
      dropped unsolved `fill-opacity` from 0.6 to 0.3 (base.json:85-98) over
      the `#f0ead9` parchment background from the same day's background
      refresh. Confirmed by loading italy-provinces in a browser: the palette
      collapses into a near-uniform pastel wash — the colours are barely
      distinguishable even where they DO differ. Fixing the hash without
      revisiting the opacity would accomplish nothing visible.

      Do:
      - Compute a `colorIndex` per target at BUILD time via greedy graph
        colouring over shared borders, and write it into `map.json`. Use
        mapshaper for real adjacency if practical; a bbox-touch plus
        centroid-distance proxy is acceptable if you justify it. For point
        maps, use k-nearest-neighbour adjacency in screen-ish space.
      - Apply it at runtime WITHOUT retiling: set `colorIndex` as a
        feature-state on map load (geoclickMap.ts / the views), and change
        base.json to `["match", ["feature-state","colorIndex"], ...]` with a
        sane fallback for unset. Retiling all 44 maps would need the WSL2
        toolchain and would commit ~14MB of regenerated binaries; this
        approach avoids both. If you conclude retiling is unavoidable, STOP
        and escalate rather than doing it — that is an Ultrahigh change and
        needs the product owner's sign-off.
      - Regenerate `data/maps/index.json` if your change affects it, and keep
        GC-030's `mapData.test.ts` green.
      - Revisit the unsolved opacity as part of the same change. The
        constraint is fixed by DECISIONS.md's "Quiz solved-state contrast"
        entry: solved must remain unambiguously distinguishable from unsolved
        at a glance, and that must hold for BOTH geometry types. Within that
        constraint, make the categorical palette actually legible again. You
        may raise unsolved opacity, change the palette's value range, adjust
        the outline, or argue the palette should be dropped entirely for two
        neutral tones — but you must verify the solved/unsolved distinction
        still holds and say how you checked.
      - Write the DECISIONS.md "Map colors" entry. Note that
        `data/styles/base.json:5` already CITES a "Map colors" entry that has
        never existed; this task creates it, and GC-060 is coordinated to
        leave it alone.

      Verify on at least: italy-provinces (worst collisions), usa-states
      (North/South Dakota), great-britain-regions (highest collision rate),
      and one towns map.

      NOTE: this is the task in the programme with the most genuine design
      content — it was the first draft's only `fable` task, and it is the main
      reason the whole programme now runs on opus. Take the time it needs. If
      you cannot satisfy the DoD after two honest attempts, stop and ask the
      product owner rather than grinding — per ORCHESTRATION.md, that means the
      task is underspecified, not that you are failing at it.
    dod:
      - "zero adjacent same-colour pairs on italy-provinces, usa-states, japan-regions, china-regions, great-britain-regions — assert it in a test"
      - "colorIndex is generated at build time and committed in map.json"
      - "no .pmtiles file is regenerated"
      - "base.json reads colorIndex, with a defined fallback when feature-state is unset"
      - "GC-030's mapData.test.ts still passes, and index.json is regenerated if affected"
      - "solved vs unsolved remains unambiguous on both a polygon map and a towns map — say how you verified"
      - "before/after screenshots of italy-provinces in the task log"
      - "DECISIONS.md gains the 'Map colors' entry that base.json already cites"
      - "all four gates pass"

  - id: GC-040
    title: "Capacitor SQLite schema migrations"
    engine: opus
    effort: Medium
    wave: 1
    deps: [GC-001]
    release: v0.1.1
    branch: fix/gc-040-capacitor-migrations
    type: fix
    areas: [storage]
    priority: worth-doing
    files: [app/src/lib/capacitorProgressRepository.ts, ONBOARDING.md, DECISIONS.md]
    review_refs: [D2, "#9"]
    description: |
      The two SQLite backends are described in ONBOARDING.md as hand-mirrored
      copies of one schema. They are not equivalent implementations:

      - `desktop/src-tauri/src/lib.rs:7-32` uses tauri-plugin-sql's VERSIONED
        `Migration` list.
      - `app/src/lib/capacitorProgressRepository.ts:15-33` uses
        `CREATE TABLE IF NOT EXISTS` with NO version tracking at all, and
        passes `version: 1` to `createConnection` with no corresponding
        upgrade-statement set.

      So the real risk is not "you might forget to edit the second file" — it
      is that the Capacitor side HAS NO MIGRATION MECHANISM TO EDIT. The first
      schema change on Android is either data loss or a hand-written ALTER with
      no record of which devices applied it.

      Do:
      - Add `PRAGMA user_version`-based migration to `getDb()`: a
        `MIGRATIONS: string[]` array indexed by version, applied in order for
        any version gap, each inside a transaction, with `user_version` bumped
        on success.
      - Make migration 0 exactly reproduce the current schema, so an existing
        Android install with the tables already present converges to
        `user_version = 1` without data loss. Think carefully about the device
        that already has the tables but `user_version = 0` — that is the real
        upgrade path and the one that can destroy a user's progress.
      - Update ONBOARDING.md's "Capacitor has no equivalent of Tauri's
        migrations()" claim, which becomes false.
      - Record in DECISIONS.md why the two backends stay duplicated rather
        than sharing a generated schema (or, if you conclude sharing is worth
        it, propose it there — but do not implement a shared-schema build step
        in this task).

      NOTE: neither SQLite backend has a single test today, and nothing in
      this task can be exercised without an Android device. Be conservative.
      Describe your manual test plan in the task log even though you cannot run
      it.
    dod:
      - "`PRAGMA user_version` drives migration; migration 0 reproduces today's schema exactly"
      - "the existing-tables-but-version-0 upgrade path is handled and explained in a comment"
      - "column names still match sqliteProgressRepository.ts and lib.rs exactly"
      - "ONBOARDING.md's stale 'no equivalent of migrations()' claim is corrected"
      - "DECISIONS.md records the duplication decision"
      - "a written manual test plan for a real device is in the task log"
      - "all four gates pass"

