# Geoclick remediation programme — machine-readable task spec.
# Read by scripts/task.mjs and by the orchestrator (docs/ORCHESTRATION.md).
# Human-readable roadmap: REMEDIATION_PLAN.md. Releases: RELEASES.md.
#
# THIS FILE IS SPEC, NOT STATE. Live task state lives in
# .orchestrator/state/GC-0NN.json (gitignored, written only by scripts/task.mjs);
# the user-facing progress ledger is the table in REMEDIATION_PLAN.md, ticked as
# each task merges. Nothing here changes while the programme runs, except when
# the product owner rewrites a task that turned out to be underspecified.
#
# Schema
#   id          GC-NNN, stable forever. Appears in branch name, commits, state file.
#   title       One line.
#   engine      opus — the single engine for the whole programme (see meta.engine).
#   effort      Low | Medium | High | Ultrahigh
#   wave        earliest DAG position; also the release batching unit (RELEASES.md)
#   deps        task ids that must be MERGED INTO main first
#   release     tag this task ships under
#   branch      exact branch name to use
#   type        fix | feat | perf | refactor | chore | docs  (used to group changelog entries)
#   areas       subsystem tags, free-form
#   priority    must-fix | worth-doing | nice-to-have  (CODE_REVIEW_2026-09-13.md's tiers)
#   files       primary files touched
#   review_refs findings from the 2026-09-13 review this closes
#   description handed verbatim to the agent working the task
#   dod         definition of done; ALL items must be true before asking for approval

meta:
  programme: geoclick-remediation
  draft: 3 # v3: ONE opus agent in a sequential loop, no multi-agent, no worktrees
  source_review: 2026-09-13 independent code/design review
  base_commit: 14383d5
  integration_branch: main
  # One engine, one agent, one task at a time. There is no implementer/reviewer
  # split: the product owner is the review gate, at merge time.
  engine: opus
  concurrency_max: 1
  state_dir: .orchestrator/state
  ledger: docs/REMEDIATION_PLAN.md # the committed progress table
  gates:
    - npm run check
    - npm run test
    - npm run lint
    - npm run build --workspace=app
  gates_baseline: "check/test/build pass (measured at c5c786e); lint FAILS until GC-001 merges"
  dev_port: 5174 # single fixed port; 5173 stays free for the product owner
  attribution_trailer: |
    Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>

# A batch is a completed wave; wave 0 ships with wave 1, and waves 3+4 ship
# together as the closing milestone. Reasoning: RELEASES.md.
releases:
  - version: v0.1.1
    theme: Correctness, gates and platform
    batch: waves 0 + 1
    tasks:
      [
        GC-001,
        GC-002,
        GC-003,
        GC-010,
        GC-020,
        GC-030,
        GC-040,
        GC-050,
        GC-060,
        GC-070
      ]
  - version: v0.1.2
    theme: Extraction, hygiene, storage, performance
    batch: wave 2
    tasks: [GC-021, GC-031, GC-041, GC-071]
  - version: v0.2.0
    theme: "Milestone — known issues from the 2026-09-13 review resolved"
    batch: waves 3 + 4 + programme close
    # GC-080 is wave 1 (DAG-ready alongside the rest of v0.1.1) but the product
    # owner asked to hold it for the closing milestone instead - an explicit
    # per-RELEASES.md override, not a dependency requirement.
    tasks: [GC-004, GC-022, GC-032, GC-033, GC-080]

# Dropped from the first draft. The nice-to-have tier is NO LONGER dropped: the
# product owner restored it on the condition that each item is low effort, which
# all eleven are (every one was Low in the first draft's own estimate). They are
# back as GC-004 / GC-031 / GC-033 / GC-080 and as folded sub-items in GC-003,
# GC-020, GC-022 and GC-041. Only GC-000 stays dropped.
dropped:
  - id: GC-000
    reason: "Worktree parallelism already proven 2026-09-13 (ROADMAP.md process notes). Not a spike, not an open question — and moot now that the loop runs in the main checkout."

tasks:

  - id: GC-001
    title: "Repair the lint gate (.gitattributes, renormalize, format)"
    engine: opus
    effort: Medium
    wave: 0
    deps: []
    release: v0.1.1
    branch: fix/gc-001-lint-gate
    type: chore
    areas: [tooling]
    priority: must-fix
    files: [.gitattributes, "**/*.ts", "**/*.svelte", "**/*.json", "**/*.md"]
    review_refs: [S1, "#3"]
    description: |
      `npm run lint` exits 1 and has done so through at least three merged
      feature branches. Two independent causes:

      1. `core.autocrlf=true` on the dev machine, and `.gitattributes` only
         declares `*.sh`, `gradlew` and binary formats. Every `.ts`/`.svelte`
         file is therefore CRLF on disk, and Prettier's default
         `endOfLine: "lf"` flags all 39 files. Because the script is
         `prettier --check . && eslint .`, the `&&` short-circuits and
         **ESLint never runs at all**.
      2. Independently of line endings, three files are genuinely unformatted
         and were committed that way:
         `app/src/lib/capacitorProgressRepository.ts`,
         `app/src/lib/QuizView.svelte`, `app/src/routes/+page.svelte`.

      Symptom to confirm you have fixed it: `git status` currently reports
      `desktop/src-tauri/Cargo.toml`, `mobile/android/app/capacitor.build.gradle`
      and `mobile/android/capacitor.settings.gradle` as modified while
      `git diff` shows no content change. That is pending renormalization.

      Do:
      - Add `* text=auto eol=lf` to `.gitattributes`, keeping every existing
        `binary` declaration above it so binaries are still excluded. Verify
        `.pmtiles`, `.jar`, `.png`, `.ico`, `.icns`, `.woff*`, `.ttf` remain
        binary — a regression here silently corrupts the tilesets and the
        repo has already been burned by exactly that.
      - Run `git add --renormalize .` and commit the result as its own commit,
        separate from the formatting commit, so the diff is reviewable.
      - Run `npm run format` and commit the three genuinely-unformatted files.
      - Confirm `npx eslint .` runs and is clean (it was at c5c786e — you are
        restoring a gate, not fixing lint errors).

      Do NOT change any Prettier or ESLint rule to make the check pass.
      This must land alone: it touches every text file in the tree and will
      conflict with every other branch. It is the whole of wave 0.
    dod:
      - "`npm run lint` exits 0 from a clean checkout"
      - "`npx eslint .` demonstrably executes (paste its output in the task log)"
      - "`git status` is clean immediately after checkout — no phantom-dirty files"
      - "`.gitattributes` still declares every pre-existing binary pattern as binary"
      - "`npm run check`, `npm run test`, `npm run build --workspace=app` still pass"
      - "renormalization and formatting are separate commits"
      - "ONBOARDING.md gotchas section gains a short entry: this is the 5th CRLF variant"

  - id: GC-002
    title: "Gate runner script and pre-push hook"
    engine: opus
    effort: Low
    wave: 1
    deps: [GC-001]
    release: v0.1.1
    branch: chore/gc-002-gate-hook
    type: chore
    areas: [tooling]
    priority: worth-doing
    files: [scripts/task.mjs, package.json, .husky/pre-push, ONBOARDING.md, README.md]
    review_refs: [D7, "#15"]
    description: |
      The project's only quality gate is the human plus a Netlify build. There
      is no CI and adding a hosted one is out of scope. A local pre-push hook
      costs nothing and would have caught GC-001 immediately.

      Do:
      - Harden `scripts/task.mjs`'s existing `gates` subcommand: run the four
        gate commands in order, stream output, stop at the first failure, exit
        non-zero, and support `--json`. (Most of this is already there — read it
        before rewriting it.)
      - Add a `pre-push` git hook that runs `node scripts/task.mjs gates`.
        Use a committed hook plus `git config core.hooksPath`, or husky —
        your call, but it must survive a fresh clone with one documented
        command, and that command goes in ONBOARDING.md and README.md.
      - Add an escape hatch (`--no-verify` is fine) and document it.
      - Housekeeping (the product owner asked for no zombies): delete the stale
        local branches `worktree-agent-*`, left over from earlier agent runs,
        and make sure `node scripts/task.mjs doctor` reports a clean bill of
        health afterwards.

      Do NOT add GitHub Actions or any hosted CI. Do NOT make the hook run the
      Tauri or Android build — a pre-push that takes four minutes gets
      `--no-verify`'d every time. Do NOT change the loop subcommands (`init`,
      `start`, `state`, `status`, `log`, `finish`, `doctor`): they are the
      harness contract this programme runs on, and you are using them right now.
    dod:
      - "`node scripts/task.mjs gates` runs all four gates and exits non-zero on first failure"
      - "`node scripts/task.mjs gates --json` emits a machine-readable verdict"
      - "a push with a deliberately-broken format is rejected by the hook"
      - "`--no-verify` still allows the push, and that is documented"
      - "hook installation is one documented command in ONBOARDING.md and README.md"
      - "stale `worktree-agent-*` branches deleted; `task.mjs doctor` reports clean"
      - "the other task.mjs subcommands still work after your edit — run `doctor` and `status`"
      - "all four gates pass"

  - id: GC-003
    title: "Test harness: restore the browser Vitest project"
    engine: opus
    effort: Medium
    wave: 1
    deps: [GC-001]
    release: v0.1.1
    branch: chore/gc-003-test-harness
    type: chore
    areas: [testing]
    priority: worth-doing
    files: [app/vite.config.ts, app/package.json]
    review_refs: [D1, "#11"]
    description: |
      `app/vite.config.ts` defines exactly one Vitest project (`server`,
      `environment: node`) whose `exclude` is
      `['src/**/*.svelte.{test,spec}.{js,ts}']`. The SvelteKit template's
      `client` (browser) project was removed. Consequence: a `.svelte.test.ts`
      written today silently does not run. Component testing is not merely
      unwritten — it is structurally foreclosed. Four of the review's six
      must-fix findings live in code no test can currently reach.

      Do:
      - Restore a second Vitest project for component tests. Prefer
        `vitest-browser-svelte` with Playwright as the provider if it installs
        cleanly on Windows; fall back to jsdom if it does not. Either is
        acceptable — say which you chose and why in the task log.
      - Prove it works with ONE smoke test: mount `LanguageSwitcher.svelte`,
        assert three buttons render, click DE, assert `aria-pressed` moves.
        That component has no MapLibre dependency, so it is the right canary.
      - Do NOT write component tests for the map views in this task; that is
        deliberately deferred so this task stays reviewable.

      ALSO (review item #20, restored nice-to-have, ~1 minute): delete
      `app/src/lib/vitest-examples/` (`greet.ts` + `greet.spec.ts`). It is
      leftover template scaffolding and it is one of the "41 tests", so the
      test count is currently flattering. Expect the total to drop by 1 for the
      scaffold and rise by 1 for the smoke test.
    dod:
      - "a second Vitest project exists and `*.svelte.test.ts` files actually execute"
      - "the LanguageSwitcher smoke test passes and fails if the component is broken"
      - "`npm run test` runs both projects and reports both"
      - "the chosen provider (browser vs jsdom) is justified in the task log"
      - "`app/src/lib/vitest-examples/` no longer exists"
      - "all four gates pass"

  - id: GC-004
    title: "Typecheck and lint data/scripts"
    engine: opus
    effort: Low
    wave: 3
    deps: [GC-001, GC-031]
    release: v0.2.0
    branch: chore/gc-004-scripts-typecheck
    type: chore
    areas: [tooling]
    priority: nice-to-have
    files: [data/tsconfig.json, app/eslint.config.js, package.json]
    review_refs: ["#25"]
    description: |
