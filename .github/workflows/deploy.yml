name: Deploy

# Deploys straight via wrangler, bypassing Cloudflare's own Git integration
# (Workers Builds) - that flow hit an unresolved account-side bug ("build
# token belongs to a user who has left your organization") that persisted
# across regenerating the token. See ROADMAP.md's Iteration 3.5 notes.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm ci

      - run: npm run build --workspace=app

      - name: Deploy
        # `wrangler deploy`, not `wrangler pages deploy` - the dashboard
        # created "geoclick2027" as a Worker (its newer unified Workers+Pages
        # model), not a classic Pages project, so the Pages-specific command
        # errors with "The Pages project does not exist" even though the
        # project is right there. Run from app/ (not repo root) since
        # wrangler refuses to run at all from an npm-workspaces root.
        run: npx wrangler deploy
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
